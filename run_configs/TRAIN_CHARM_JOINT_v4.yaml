# TRAIN_CHARM_JOINT.yaml
# ----------------------
# Production joint-training run: Mmin = 5×10¹² Msun/h (lgMmin = 12.70),
# 1800 training sims, 8 GPUs / 8 shards.
#
# Inherits all defaults from BASE_CONFIG.yaml; the keys below override
# only what's specific to this run (Mmin-dependent ranges, dataset size,
# paths, W&B run name).
#
# Usage:
#   torchrun --standalone --nproc_per_node=8 \
#       charm/run_charm_joint_ddp.py --config run_configs/TRAIN_CHARM_JOINT.yaml

extends: BASE_CONFIG.yaml

network_settings:
  # Larger encoder + heads for the full run (BASE has smaller ones for the trial)
  K_Mdiff:                       8
  B_Mdiff:                       [[0, 0.85], [0, 0.55], [0, 0.45], [0, 0.35],
                                   [0, 0.25], [0, 0.15], [0, 0.10], [0, 0.05]]
  nflows_Mdiff:                  2
  base_dist_Mdiff:               gumbel
  add_Ntot_M1_cond_for_Mdiff:    true

  # CRITICAL: must match sim_settings.Nmax — BASE_CONFIG defaults to 4 (for Nmax=4
  # trial run); override here so the multi head has one Gaussian component per
  # allowed count [1 … Nmax].  Forgetting this cap the mock catalog at 4 halos/voxel.
  ngauss_Nhalos:                 8

sim_settings:
  # Dataset split (200 sims held out: 100 val + 100 test)
  nsims_train:  1800       # sims 0–1799  (training)
  nsims_val:    100        # sims 1800–1899 (validation)
  nsims_test:   100        # sims 1900–1999 (never touched)
  nsims:        1800       # kept for backward compatibility

  # Mass cut and physical ranges for normalisation
  lgMmin:  12.6989           # log10(5e12) — matches Mmin_cut in halo processing
  lgMmax:  15.70
  vmin:   -1350.
  vmax:    1350.
  cmin:    1.              # NOTE: trained on raw c_sim here (not residual)
  cmax:    15.

  # Halo catalogue
  Nmax:              8


# sim_settings above.

train_settings:
  # train_settings.shard_dir is no longer set explicitly — the training
  # script falls back to data_settings.shard_dir, which is auto-derived
  # from Mmin_cut_str (see config_loader._derive_data_paths).
  nsims_per_batch:  200    # doubled from 100 after float16→bfloat16 fix frees ~13 GB per rank

  binary_loss_mode:    none

  checkpoint_dir:    ../model_checkpoints/CHARM_JOINT_v4/
  resume_checkpoint: null

  phases:
    - heads:          [binary, multi]
      nepochs:        1000
      learning_rate:  5.0e-4
      warmup_frac:    0.07

    - heads:          [m1]
      nepochs:        500
      learning_rate:  5.0e-4
      warmup_frac:    0.07

    - heads:          [mdiff]
      nepochs:        500
      learning_rate:  5.0e-4
      warmup_frac:    0.07

    - heads:          [pos]
      nepochs:        1000
      learning_rate:  5.0e-4
      warmup_frac:    0.07

    - heads:          [vel]
      nepochs:        1000
      learning_rate:  5.0e-4
      warmup_frac:    0.07

    - heads:          [conc]
      nepochs:        500
      learning_rate:  5.0e-4
      warmup_frac:    0.07

    - heads:          [binary, multi, m1, mdiff, pos, vel, conc]
      nepochs:        2500
      learning_rate:  1.0e-4
      warmup_frac:    0.07


  # Verbose on for the long production run — gives us per-step timings
  # and head EMAs once warmup completes. Cheap relative to total runtime.
  verbose: false
  # Use BASE phases (production schedule): Kendall on from phase 0,
  # 5e-4 → 2e-4 LR ramp validated on the trial.

wandb:
  run_name: full_v4            # auto-generated; set via --wandb_run_name to label
  watch_log_freq: 0            # disabled — gradient histograms add backward-hook overhead

data_settings:
  n_shards:       12         # one HDF5 shard per GPU; must divide nsims_train

  # halo_hdf5_dir and shard_dir are auto-derived by config_loader from
  # Mmin_cut_str (and the optional data_root key, default '../data'):
  #   halo_hdf5_dir = ../data/halos_Mmin5e12
  #   shard_dir     = ../data/shards_Mmin5e12
  # Override either by setting it explicitly here.

  # Mass cut — must match sim_settings.lgMmin (= log10(Mmin_cut)).
  # Mmin_cut_str also controls the auto-derived output folder names,
  # so changing it cleanly produces an isolated dataset directory.
  Mmin_cut:       5.0e12
  Mmin_cut_str:   '5e12'
  nMax_h_raw:     12        # halos stored per voxel in per-sim HDF5; ≥ Nmax
