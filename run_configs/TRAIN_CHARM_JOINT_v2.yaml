# TRAIN_CHARM_JOINT_v2.yaml
# -------------------------
# Same as v1 (Mmin = 5×10¹² Msun/h, 1800 training sims, 8 GPUs / 8 shards)
# but switches the binary head from subsample (π_train=0.5 + Bayesian
# correction) to focal loss (directly learns P(occ|features, π_true)).
#
# Why focal over subsample:
#   subsample trains under an artificial balanced prior (π=0.5); at inference
#   a Bayesian correction factor r = (π_target/0.5)·(0.5/(1-π_target)) is
#   applied to recover the true occupancy probability. This correction relies
#   on pw_occ being a perfectly calibrated likelihood ratio, which fails at
#   extreme cosmologies (very low/high occupancy), causing 20-50% total-
#   count errors.  Focal loss uses all voxels under the true class distribution
#   so pw_occ ≈ P(occ|features, π_true) directly — no correction needed.
#
# IMPORTANT — focal loss implementation note (combined_models_v2.py):
#   The base loss MUST be cls_nll = -log(pw_correct), NOT the raw GMM NLL.
#   The fixed-sigma GMM (sigma=0.05) gives:
#     raw_nll = -log(pw_correct) - log(1/(sigma*sqrt(2pi)))
#             = -log(pw_correct) - 2.077
#   This constant offset makes raw_nll NEGATIVE for pw_correct > 12.5%,
#   inverting the gradient direction and driving pw_correct to a pathological
#   equilibrium at ~0.33 (causes 3-6x too many halos at inference).
#   The fix: use cls_nll = -log(pw_correct) directly (always >= 0).
#
# Usage:
#   sbatch run_scripts/run_train_full_v2.sh
#   # or directly:
#   torchrun --standalone --nproc_per_node=8 \
#       charm/run_charm_joint_ddp.py --config run_configs/TRAIN_CHARM_JOINT_v2.yaml

extends: BASE_CONFIG.yaml

network_settings:
  # Larger encoder + heads for the full run (BASE has smaller ones for the trial)
  K_Mdiff:                       8
  B_Mdiff:                       [[0, 0.85], [0, 0.55], [0, 0.45], [0, 0.35],
                                   [0, 0.25], [0, 0.15], [0, 0.10], [0, 0.05]]
  nflows_Mdiff:                  2
  base_dist_Mdiff:               gumbel
  add_Ntot_M1_cond_for_Mdiff:    true

  # CRITICAL: must match sim_settings.Nmax — one Gaussian component per
  # allowed count [1 … Nmax].
  ngauss_Nhalos:                 8

sim_settings:
  # Dataset split (200 sims held out: 100 val + 100 test)
  nsims_train:  1800       # sims 0–1799  (training)
  nsims_val:    100        # sims 1800–1899 (validation)
  nsims_test:   100        # sims 1900–1999 (never touched)
  nsims:        1800       # kept for backward compatibility

  # Mass cut and physical ranges for normalisation
  lgMmin:  12.6989           # log10(5e12) — matches Mmin_cut in halo processing
  lgMmax:  15.70
  vmin:   -1350.
  vmax:    1350.
  cmin:    1.
  cmax:    15.

  # Halo catalogue
  Nmax:              8

train_settings:
  nsims_per_batch:  200

  # Focal loss: trains under the true class distribution — no π_train=0.5
  # bias, no Bayesian correction needed at inference.  gamma=2.0 is the
  # standard value from Lin et al. 2017; it strongly down-weights easy
  # (well-classified) voxels and focuses capacity on hard / boundary cases.
  binary_loss_mode:    none

  checkpoint_dir:    ../model_checkpoints/CHARM_JOINT_v2/
  resume_checkpoint: null

  phases:
    - heads:          [binary, multi]
      nepochs:        1000
      learning_rate:  5.0e-4
      warmup_frac:    0.07

    - heads:          [binary, multi, m1]
      nepochs:        300
      learning_rate:  5.0e-4
      warmup_frac:    0.07

    - heads:          [binary, multi, m1, mdiff]
      nepochs:        300
      learning_rate:  2.0e-4
      warmup_frac:    0.07

    - heads:          [binary, multi, m1, mdiff, pos]
      nepochs:        300
      learning_rate:  2.0e-4
      warmup_frac:    0.07

    - heads:          [binary, multi, m1, mdiff, pos, vel]
      nepochs:        300
      learning_rate:  2.0e-4
      warmup_frac:    0.07

    - heads:          [binary, multi, m1, mdiff, pos, vel, conc]
      nepochs:        2500
      learning_rate:  2.0e-4
      warmup_frac:    0.07

  verbose: false

wandb:
  run_name: full_v2
  watch_log_freq: 0

data_settings:
  n_shards:       12

  Mmin_cut:       5.0e12
  Mmin_cut_str:   '5e12'
  nMax_h_raw:     12
