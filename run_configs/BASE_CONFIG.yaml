# BASE_CONFIG.yaml
# ----------------
# Shared defaults for all CHARM joint training runs. Variant configs
# (e.g. TRAIN_CHARM_JOINT.yaml, TRAIN_CHARM_JOINT_trial_Mmin1e14.yaml)
# declare:
#     extends: BASE_CONFIG.yaml
# at the top and override only the keys that genuinely differ between
# runs (Mmin, paths, dataset size, …).
#
# Merge rules (see charm/config_loader.py):
#   - dicts: deep-merged (child overrides parent at leaf level)
#   - scalars and lists: child fully replaces parent
# So a child that wants to change a few phases must restate the entire
# `phases:` list — by design, since each variant tunes phases differently.

# ── Simulation / data settings (Mmin-independent geometry) ───────────────────
sim_settings:
  # Sub-volume sampling
  nsubvol_per_ji:    64       # sub-volumes selected per simulation
  nsubvol_fid:       512      # total sub-volumes available per simulation

  # Grid dimensions
  ns_d:   128                 # DM density field grid side
  ns_h:   128                 # halo grid side
  nb:     8                   # sub-cubes per side  →  nax_h = ns_h // nb = 16

  # CNN kernel / encoder layout
  nf:           3             # kernel size
  layers_types: [res, res]

  # FastPM input channels (density + velocity at z=0.5  →  ninp = 1 + 3 = 4)
  z_all_FP:     [0.5, 'v_0.5']
  z_inference:  '0.5'

  # Halo catalogue
  Nmax:              4
  mass_type:         rockstar_200c
  rescale_sub:       0.0
  num_cosmo_params:  5

  cond_sim:  fastpm
  stype:     cic
  is_HR:     true
  # NOTE: lgMmin, lgMmax, vmin/vmax, cmin/cmax are MANDATORY per-run
  # overrides — they depend on the mass cut and on which concentration
  # variable (raw c_sim vs residual c_diff) is being trained on.

# ── Network / head hyperparameters ────────────────────────────────────────────
network_settings:
  # Encoder
  nfeature_cnn:             32
  encoder_act:              lrelu
  use_film:                 true       # FiLM cosmology modulation in encoder
  concat_cosmo_after_film:  true       # also concat raw cosmo to cond_out
  grad_checkpoint_encoder:  false      # set true on small-memory GPUs

  # Shared MLP hidden width for all distribution heads
  hidden_dim_MAF: 128

  # ── Binary / multiclass (SumGauss Ntot heads) ──
  base_dist_Ntot:   normal
  ngauss_Ntot:      2          # empty vs. occupied
  ngauss_Nhalos:    4          # one component per Nmax class

  # ── M1 (heaviest halo mass, normalised to [0, 1]) ──
  # Histogram is monotone exp-decay from 0 → gumbel base + tight B = [0, 1]
  # spends every spline knot inside the data support. ngauss_M1 is unused
  # under gumbel (only loc/scale emitted); kept = 1 for clarity.
  K_M1:                  8
  B_M1:                  [0, 1]
  nflows_M1:             4
  base_dist_M1:          gumbel
  ngauss_M1:             1
  add_Ntot_cond_for_M1:  true

  # ── Mdiff (autoregressive mass differences) ──
  # Per-component bounds: data range shrinks from ΔM1 → ΔM2 → ΔM3.
  # _normalize_bounds(B, dim) consumes one (lo, hi) per autoreg step.
  K_Mdiff:                       8
  B_Mdiff:                       [[0, 0.85], [0, 0.55], [0, 0.45], [0, 0.35],
                                   [0, 0.25], [0, 0.15], [0, 0.10], [0, 0.05]]
  nflows_Mdiff:                  4
  base_dist_Mdiff:               gumbel
  add_Ntot_M1_cond_for_Mdiff:    true

  # ── Velocity (normalised to [-0.5, 0.5]) ──
  K_vel:          8
  B_vel:          [-0.5, 0.5]
  nflows_vel:     2
  base_dist_vel:  gauss
  # If true, the velocity head is conditioned on the per-halo sub-voxel
  # position offsets in addition to masses and shared encoder features.
  # Keep false for compatibility with existing checkpoints.
  add_pos_cond_for_vel: false

  # ── Concentration (normalised to [0, 1]) ──
  K_conc:         8
  B_conc:         [0, 1]
  nflows_conc:    2
  base_dist_conc: gumbel

  # ── Sub-voxel position (offsets in [-0.5, 0.5] voxel units) ──
  K_pos:          8
  B_pos:          [-0.5, 0.5]
  nflows_pos:     2
  base_dist_pos:  gauss

# ── Training settings ─────────────────────────────────────────────────────────
train_settings:
  # Optimiser / regularisation
  min_lr:           1.0e-6
  grad_clip:        1.0
  weight_decay:     1.0e-4
  frozen_lr_scale:  0.3      # LR multiplier for encoder+old heads at each new phase

  # Logging & checkpointing
  log_every:    10
  save_every:   10
  val_every:    10

  # Verbose / heartbeat (see TRAIN_CHARM_JOINT.yaml for full descriptions)
  verbose:          false
  wandb_log_every:  2
  ema_alpha:        0.05
  heartbeat:        false

  # Kendall multi-task uncertainty weighting
  use_kendall:             true
  kendall_lr_scale:        0.05    # slow LR for s_i
  kendall_log_var_clamp:   3.0     # |s_i| ≤ 3 → σ_i ∈ [0.22, 4.5]
  kendall_start_phase:     0       # 0 = active from phase 0

  # Binary-head class-imbalance handling. At low occupancy fractions
  # (e.g. Mmin=1e14 → ~0.26% occupancy) the per-voxel mean NLL is
  # dominated 99.7% by empty voxels, and the optimizer settles into a
  # degenerate plateau with pw_occ ≪ 1 for *all* voxels (mock catalog
  # becomes mostly false positives). Available modes:
  #   none      — legacy mean-over-all-voxels (default for compatibility)
  #   subsample — keep all occupied + equal-size random empty draw (1:1)
  #   alpha     — per-voxel inverse-frequency weights, mean-1 normalised
  #   focal     — focal loss (1 - p_correct)^binary_focal_gamma
  binary_loss_mode:    none
  binary_focal_gamma:  2.0     # only used when binary_loss_mode = focal

  # Staggered training (recommended)
  staggered: true

  # torch.compile — wraps the model before DDP for ~10–20% throughput gain.
  # Requires PyTorch 2.0+ and a working Triton install (H100 / A100 friendly).
  # Set to false if you hit compilation errors or need faster cold-start.
  torch_compile: true

  # Default phase block — production-scale epochs with the LR schedule we
  # converged on after the trial run. Variant configs replace this list
  # wholesale (list-replace semantics), so a child config must restate
  # all phases if it wants any tweak.
  phases:
    - heads:          [binary, multi]
      nepochs:        800
      learning_rate:  5.0e-4
      warmup_frac:    0.07

    - heads:          [binary, multi, m1]
      nepochs:        800
      learning_rate:  5.0e-4
      warmup_frac:    0.07

    - heads:          [binary, multi, m1, mdiff]
      nepochs:        1200
      learning_rate:  2.0e-4
      warmup_frac:    0.07

    - heads:          [binary, multi, m1, mdiff, pos]
      nepochs:        800
      learning_rate:  2.0e-4
      warmup_frac:    0.07

    - heads:          [binary, multi, m1, mdiff, pos, vel]
      nepochs:        1200
      learning_rate:  2.0e-4
      warmup_frac:    0.07

    - heads:          [binary, multi, m1, mdiff, pos, vel, conc]
      nepochs:        1600
      learning_rate:  2.0e-4
      warmup_frac:    0.07

  # Joint (non-staggered) fallback — only used when staggered: false
  heads:          [binary, multi, m1, mdiff, pos, vel, conc]
  nepochs:        6400
  learning_rate:  1.0e-3
  warmup_frac:    0.07

# ── Profiler (torch.profiler) ────────────────────────────────────────────────
profile:
  enabled:        false
  wait:           1
  warmup:         2
  active:         5
  repeat:         1
  exit_after:     true
  trace_dir:      null
  record_shapes:  false       # ⚠️ true → 10–100× slowdown on CHARM. Leave off.
  with_stack:     false       # ⚠️ very slow + huge traces.
  with_modules:   true
  profile_memory: false
  print_summary:  true
  topk:           20
  sort_by:        self_cuda_time_total

# ── Weights & Biases ─────────────────────────────────────────────────────────
wandb:
  enabled:        true
  project:        CHARM_joint
  entity:         null
  run_name:       null         # variant configs override
  watch_log_freq: 20

# ── Data pipeline paths (raw inputs are shared across all runs) ───────────────
data_settings:
  # Raw simulation data
  rockstar_dir:   /mnt/home/fvillaescusa/ceph/Quijote/Halos/Rockstar/latin_hypercube_HR
  fastpm_dir:     /mnt/ceph/users/spandey/Quijote/data_NGP_self_fastpm_LH
  lh_cosmo_file:  /mnt/ceph/users/spandey/Quijote/latin_hypercube_params.txt

  # ngp_funcs compiled .so location (relative to repo root)
  ngp_funcs_dir:  notebooks/testing

  # Halo processing — snapshot/redshift independent of mass cut
  snapnum:        3            # snapshot number  (z=0.5)
  z_snap:         '0.5'        # redshift string used in FastPM filenames
  BoxSize:        1000.0       # Mpc/h

  # Sub-volume RNG
  subvol_seed:    42           # base seed; per-sim seed = subvol_seed * 1000 + isim
  # NOTE: Mmin_cut, Mmin_cut_str, nMax_h_raw, n_shards, halo_hdf5_dir, shard_dir
  # are MANDATORY per-run overrides.
